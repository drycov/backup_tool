# Backup Tools — стек для Docker / Portainer
# Документация: deploy/PORTAINER.md
# Переменные: .env (env_file для всех сервисов). Шаблон: .env.example

name: backup-tools

services:
  db:
    profiles:
      - postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backup}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backup-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backup} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - com.backup-tools.service=db

  scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    image: backup-tools-scanner:${SCANNER_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      PYTHONUNBUFFERED: "1"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-240}"
      DB_WAIT_SECONDS: "${DB_WAIT_SECONDS:-90}"
      TASK_WORKER_INLINE: "${TASK_WORKER_INLINE:-true}"
    ports:
      - "${SCANNER_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ${STACK_PATH:-.}/inventory:/data/inventory
      - ${STACK_PATH:-.}/oxidized:/data/oxidized
      - oxidized-data:/var/lib/oxidized
      - ${STACK_PATH:-.}/oxidized-ssh:/home/oxidized/.ssh:ro
    networks:
      - backup-net
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - com.backup-tools.service=scanner

  scheduler:
    image: backup-tools-scanner:${SCANNER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    env_file:
      - .env
    environment:
      TASK_WORKER_INLINE: "false"
    volumes:
      - ${STACK_PATH:-.}/inventory:/data/inventory
      - ${STACK_PATH:-.}/oxidized:/data/oxidized
      - oxidized-data:/var/lib/oxidized
    networks:
      - backup-net
    depends_on:
      scanner:
        condition: service_healthy
    labels:
      - com.backup-tools.service=scheduler

  scanner-worker:
    profiles:
      - worker
    image: backup-tools-scanner:${SCANNER_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "manage.py", "run_task_worker", "--poll", "30"]
    env_file:
      - .env
    environment:
      TASK_WORKER_INLINE: "false"
    volumes:
      - ${STACK_PATH:-.}/inventory:/data/inventory
      - ${STACK_PATH:-.}/oxidized:/data/oxidized
      - oxidized-data:/var/lib/oxidized
      - ${STACK_PATH:-.}/oxidized-ssh:/home/oxidized/.ssh:ro
    networks:
      - backup-net
    depends_on:
      scanner:
        condition: service_healthy
    labels:
      - com.backup-tools.service=scanner-worker

  ollama:
    profiles:
      - ai
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - backup-net
    labels:
      - com.backup-tools.service=ollama

  oxidized:
    profiles:
      - external
    image: oxidized/oxidized:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /home/oxidized
    ports:
      - "${OXIDIZED_PORT:-8888}:8888"
    volumes:
      - ${STACK_PATH:-.}/oxidized:/home/oxidized/.config/oxidized
      - oxidized-data:/var/lib/oxidized
      - ${STACK_PATH:-.}/oxidized-ssh:/home/oxidized/.ssh
      - ${STACK_PATH:-.}/oxidized/entrypoint.sh:/entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh
    depends_on:
      scanner:
        condition: service_healthy
    networks:
      - backup-net
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; Net::HTTP.get(URI('http://127.0.0.1:8888/nodes.json'))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - com.backup-tools.service=oxidized

networks:
  backup-net:
    driver: bridge

volumes:
  pg-data:
  oxidized-data:
  ollama-data:
