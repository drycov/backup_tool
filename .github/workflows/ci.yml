name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check api/views.py api/urls.py services/auth.py services/compliance.py services/compliance_report.py services/inventory.py services/schemas.py services/ai_analyzer.py services/scheduler.py services/task_worker.py backup_tools/settings.py tests/

      - name: Collect static
        run: python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: pytest --cov=services --cov-report=term-missing
        env:
          ADMIN_PASSWORD: pytest-admin-pass
          JWT_SECRET: pytest-ci-secret-minimum-32-chars-long

      - name: OpenAPI drift check
        run: python scripts/check_openapi_drift.py --check

      - name: Compile check
        run: python -m compileall -q api services core
